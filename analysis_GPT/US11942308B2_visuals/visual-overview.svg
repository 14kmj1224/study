<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">US11942308B2 핵심 개요</title>
  <desc id="desc">기존 감시의 사각지대, 온도 기반 이상 감지, 경고와 정지 제어를 설명하는 요약도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315A78"/></marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172B3A}
      .title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#4D6473}.h{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px;fill:#526A78}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#F6F9FB"/>
  <text x="70" y="68" class="title">마이크로파 플라즈마 점화 실패를 온도로 먼저 감지</text>
  <text x="70" y="102" class="sub">US11942308B2 · Tokyo Electron · 2024-03-26</text>

  <rect x="70" y="145" width="310" height="330" rx="22" fill="#FFFFFF" stroke="#B9CAD5" stroke-width="2"/>
  <circle cx="125" cy="202" r="28" fill="#EAF1F5"/><text x="117" y="211" class="h">1</text>
  <text x="170" y="210" class="h">기존 감시의 사각지대</text>
  <text x="105" y="270" class="body"><tspan x="105" dy="0">반사파 비율과 튜너 위치가</tspan><tspan x="105" dy="34">정상처럼 보여도 안테나 내부의</tspan><tspan x="105" dy="34">이상 정합·미소 방전이 발생할 수 있음</tspan></text>
  <rect x="105" y="390" width="240" height="52" rx="12" fill="#FFF3D6"/>
  <text x="225" y="423" text-anchor="middle" class="body" fill="#8A5A00">손상 전 조기 신호가 필요</text>

  <path d="M390 310 H445" stroke="#315A78" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="455" y="145" width="310" height="330" rx="22" fill="#FFFFFF" stroke="#58A9C7" stroke-width="3"/>
  <circle cx="510" cy="202" r="28" fill="#DDF5FB"/><text x="502" y="211" class="h">2</text>
  <text x="555" y="210" class="h">온도를 선행 지표로 사용</text>
  <text x="490" y="270" class="body"><tspan x="490" dy="0">열전대(80)를 동축 도파관 내부에</tspan><tspan x="490" dy="34">삽입하고 커넥터(70)·캡(72)</tspan><tspan x="490" dy="34">부근의 국부 온도를 감시</tspan></text>
  <circle cx="610" cy="400" r="42" fill="#DDF5FB" stroke="#1696B8" stroke-width="5"/>
  <path d="M610 372 V404 L632 420" fill="none" stroke="#1696B8" stroke-width="7" stroke-linecap="round"/>
  <text x="675" y="406" class="body">온도 상승 → 이상 가능성</text>

  <path d="M775 310 H830" stroke="#315A78" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="840" y="145" width="290" height="330" rx="22" fill="#FFFFFF" stroke="#B9CAD5" stroke-width="2"/>
  <circle cx="895" cy="202" r="28" fill="#EAF1F5"/><text x="887" y="211" class="h">3</text>
  <text x="940" y="210" class="h">단계별 안전 조치</text>
  <rect x="875" y="265" width="220" height="70" rx="14" fill="#FFF0C2" stroke="#D99A00"/>
  <text x="985" y="294" text-anchor="middle" class="body">1차 기준 초과</text><text x="985" y="321" text-anchor="middle" class="h" fill="#8A5A00">경고</text>
  <rect x="875" y="365" width="220" height="76" rx="14" fill="#FFE0DE" stroke="#D8473F"/>
  <text x="985" y="394" text-anchor="middle" class="body">2차 기준 초과</text><text x="985" y="424" text-anchor="middle" class="h" fill="#B72D27">경보 + 플라즈마 정지</text>

  <rect x="70" y="515" width="1060" height="88" rx="16" fill="#173B57"/>
  <text x="100" y="552" class="body" style="fill:#FFFFFF">실험 사례</text>
  <text x="235" y="552" class="h" style="fill:#FFFFFF">3.0 kW에서 Ant-2가 162.7°C</text>
  <text x="235" y="582" class="body" style="fill:#D7E8F1">150°C 경고 기준을 넘었고 이후 동축 도파관에서 이상 방전 흔적 확인</text>
  <text x="70" y="645" class="small">원문 기반 재구성 · 축척 아님 · 출처: PDF pp.9-16, Figs. 4-6, claims 1-5</text>
</svg>
